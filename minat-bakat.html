<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5d56"><title>Minat & Bakat — MPK-PMB XXIX</title>
<style>
:root{--bg:#f4f7fb;--ink:#17212b;--muted:#64748b;--line:#dfe7ef;--primary:#0b5d56;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:11px 14px;display:flex;gap:10px;align-items:center;z-index:5}.back{background:#eaf2f1;color:var(--primary);padding:9px 11px;border-radius:11px;font-weight:900}.top small{display:block;color:var(--muted)}main{width:min(1050px,100%);margin:auto;padding:15px 15px 90px}.hero h1{margin:4px 0;font-size:23px}.hero p{margin:0 0 14px;color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.stat,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:var(--muted)}.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{cursor:pointer}.head{display:flex;gap:10px;align-items:center}.no{font-size:24px;font-weight:900;color:var(--primary);width:42px}.name{font-weight:900;font-size:14px}.program,.tag{display:inline-block;margin-top:4px;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800;background:#eef3f5}.program{background:#eaf2f1;color:var(--primary)}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.verified{background:#e8f7ef;color:#067647}.indicated{background:#fff4df;color:#925f00}.unmapped{background:#f1f3f5;color:#667085}.modal{position:fixed;inset:0;background:#0f172a88;display:none;align-items:flex-end;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:18px}.sheethead{display:flex;justify-content:space-between;gap:10px}.close{border:0;border-radius:10px;padding:9px 11px;font-weight:900}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.cell{border:1px solid var(--line);border-radius:12px;padding:10px}.cell small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px}.rec{margin-top:12px;background:#f8fafb;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:13px;line-height:1.45}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));text-align:center}.home{display:inline-block;width:min(500px,100%);background:var(--primary);color:#fff;padding:12px;border-radius:12px;font-weight:900}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.info{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><a href="./" class="back">←</a><div><strong>Minat & Bakat Angkatan XXIX</strong><small>MPK-PMB • Politeknik KP Bitung</small></div></header>
<main><div class="hero"><h1>Peta Potensi Taruna/i</h1><p>Hobi, prestasi, kokurikuler, ekstrakurikuler, dan kategori potensi 80 Taruna/i.</p></div><div id="stats" class="stats"></div><div class="panel filters"><input id="q" placeholder="Cari nomor, nama, minat..."><select id="prodi"><option value="ALL">Semua Prodi</option><option>TPI</option><option>TPPP</option><option>MP</option></select><select id="status"><option value="ALL">Semua Status</option><option>Terverifikasi</option><option>Terindikasi</option><option>Belum Terpetakan</option></select><select id="category"><option value="ALL">Semua Kategori</option></select></div><div id="grid" class="grid"></div></main>
<div id="modal" class="modal"><div class="sheet"><div class="sheethead"><div id="ph"></div><button id="close" class="close">✕</button></div><div id="pb"></div></div></div><div class="bottom"><a class="home" href="./">Kembali ke Aplikasi Penilaian</a></div>
<script src="mbk-data-1.js?v=20260809"></script><script src="mbk-data-2.js?v=20260809"></script><script src="mbk-data-3.js?v=20260809"></script><script src="mbk-data-4.js?v=20260809"></script>
<script>
const D=window.MBK_DATA||[],$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cats=p=>[p.primary,...String(p.supporting||'').split(',').map(x=>x.trim()).filter(Boolean)],sc=s=>s==='Terverifikasi'?'verified':s==='Terindikasi'?'indicated':'unmapped';const cc=[...new Set(D.flatMap(cats).filter(x=>x&&x!=='Belum Terpetakan'))].sort();$('category').innerHTML+=cc.map(x=>`<option>${esc(x)}</option>`).join('');function stats(){let v=D.filter(x=>x.potentialStatus==='Terverifikasi').length,i=D.filter(x=>x.potentialStatus==='Terindikasi').length,u=D.filter(x=>x.potentialStatus==='Belum Terpetakan').length;$('stats').innerHTML=`<div class="stat"><b>${D.length}</b><span>Total Taruna/i</span></div><div class="stat"><b>${v}</b><span>Terverifikasi</span></div><div class="stat"><b>${i}</b><span>Terindikasi</span></div><div class="stat"><b>${u}</b><span>Belum Terpetakan</span></div>`}function render(){let q=$('q').value.trim().toLowerCase(),pr=$('prodi').value,st=$('status').value,ca=$('category').value,l=D.filter(p=>{let t=[p.code,p.name,p.hobby,p.achievement,p.cocurricular,p.extracurricular,p.primary,p.supporting].join(' ').toLowerCase();return(!q||t.includes(q))&&(pr==='ALL'||p.program===pr)&&(st==='ALL'||p.potentialStatus===st)&&(ca==='ALL'||cats(p).includes(ca))});$('grid').innerHTML=l.map(p=>`<div class="card" data-id="${p.id}"><div class="head"><div class="no">${p.code}</div><div><div class="name">${esc(p.name)}</div><span class="program">${p.program}</span></div></div><div class="tags"><span class="tag ${sc(p.potentialStatus)}">${esc(p.potentialStatus)}</span><span class="tag">${esc(p.primary)}</span></div></div>`).join('')||'<div class="panel">Tidak ada data sesuai filter.</div>';document.querySelectorAll('.card[data-id]').forEach(x=>x.onclick=()=>openP(Number(x.dataset.id)))}function rec(p){if(p.potentialStatus==='Belum Terpetakan')return'Lakukan wawancara singkat dan beri kesempatan mencoba beberapa kegiatan untuk menggali minat.';if(p.potentialStatus==='Terverifikasi')return`Prioritaskan pembinaan pada ${p.primary}. Verifikasi bukti prestasi dan pertimbangkan untuk tim/kegiatan representatif.`;return`Berikan kesempatan terstruktur pada ${p.primary}; observasi konsistensi kemampuan dan minat sebelum ditetapkan sebagai bakat terverifikasi.`}function openP(id){let p=D.find(x=>x.id===id);$('ph').innerHTML=`<div class="head"><div class="no">${p.code}</div><div><div class="name">${esc(p.name)}</div><span class="program">${p.program}</span> <span class="tag ${sc(p.potentialStatus)}">${esc(p.potentialStatus)}</span></div></div>`;$('pb').innerHTML=`<div class="info"><div class="cell"><small>Hobi / Minat</small>${esc(p.hobby||'—')}</div><div class="cell"><small>Prestasi</small>${esc(p.achievement||'—')}</div><div class="cell"><small>Kokurikuler</small>${esc(p.cocurricular||'—')}</div><div class="cell"><small>Ekstrakurikuler</small>${esc(p.extracurricular||'—')}</div><div class="cell"><small>Kategori Utama</small>${esc(p.primary)}</div><div class="cell"><small>Kategori Pendukung</small>${esc(p.supporting||'—')}</div></div><div class="rec"><strong>Dasar status:</strong> ${esc(p.statusBasis||'—')}<br><br><strong>Rekomendasi:</strong><br>${esc(rec(p))}</div>`;$('modal').classList.add('open')}$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};['q','prodi','status','category'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));stats();render();
</script></body></html>
