name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK components
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Prepare Politeknik KP Bitung logo
        run: |
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          src = Path('android/logo-politeknik-kp-bitung-v13.b64')
          text = re.sub(r'[^A-Za-z0-9+/=]', '', src.read_text(encoding='utf-8'))
          text += '=' * ((4 - len(text) % 4) % 4)
          raw = base64.b64decode(text, validate=False)
          if not raw.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Logo JPEG tidak valid')
          out = Path('android/app/src/main/res/drawable-nodpi/politeknik_logo.jpg')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(raw)
          print('Logo prepared:', len(raw), 'bytes')
          PY

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare downloadable APK
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/MPK-PMB-XXIX-v1.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPK-PMB-XXIX-Android-v1.4
          path: downloads/MPK-PMB-XXIX-v1.4.apk

      - name: Publish APK to GitHub Pages repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/MPK-PMB-XXIX-v1.4.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish Android APK v1.4"
            git push
          fi
