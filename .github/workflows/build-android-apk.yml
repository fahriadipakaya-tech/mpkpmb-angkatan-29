name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK components
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Prepare centered Politeknik KP Bitung logo
        run: |
          mkdir -p android/app/src/main/res/drawable
          python3 - <<'PY'
          import base64, re
          src='android/logo-politeknik-kp-bitung.b64'
          dst='android/app/src/main/res/drawable/politeknik_logo.jpg'
          s=open(src,'r',encoding='utf-8').read()
          s=re.sub(r'[^A-Za-z0-9+/=]','',s)
          s += '=' * ((4-len(s)%4)%4)
          data=base64.b64decode(s, validate=False)
          open(dst,'wb').write(data)
          print('logo bytes:', len(data))
          PY

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare downloadable APK
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/MPK-PMB-XXIX-v1.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPK-PMB-XXIX-Android-v1.2
          path: downloads/MPK-PMB-XXIX-v1.2.apk

      - name: Publish APK to GitHub Pages repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/MPK-PMB-XXIX-v1.2.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish Android APK v1.2"
            git push
          fi
