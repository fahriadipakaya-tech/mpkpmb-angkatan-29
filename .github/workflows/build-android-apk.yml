name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK components
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Prepare Politeknik KP Bitung logo
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/res/drawable
          set +e
          tr -d '\r\n\t ' < android/logo-politeknik-kp-bitung-v13.b64 | base64 --decode --ignore-garbage > android/app/src/main/res/drawable-nodpi/politeknik_logo.jpg
          set -e
          SIZE=$(wc -c < android/app/src/main/res/drawable-nodpi/politeknik_logo.jpg || echo 0)
          MAGIC=$(xxd -p -l 3 android/app/src/main/res/drawable-nodpi/politeknik_logo.jpg 2>/dev/null || true)
          echo "Decoded logo: ${SIZE} bytes, magic=${MAGIC}"
          if [ "$SIZE" -lt 500 ] || [ "$MAGIC" != "ffd8ff" ]; then
            echo "Logo decode invalid; using vector fallback so APK build can continue."
            rm -f android/app/src/main/res/drawable-nodpi/politeknik_logo.jpg
            cp android/app/src/main/res/drawable/app_icon.xml android/app/src/main/res/drawable/politeknik_logo.xml
          else
            rm -f android/app/src/main/res/drawable/politeknik_logo.xml
          fi

      - name: Build APK
        shell: bash
        run: |
          set +e
          cd android
          gradle :app:assembleDebug --stacktrace 2>&1 | tee ../android-build.log
          STATUS=${PIPESTATUS[0]}
          cd ..
          echo "Gradle status: ${STATUS}"
          exit ${STATUS}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MPK-PMB-v1.4-build-log
          path: android-build.log
          if-no-files-found: ignore

      - name: Prepare downloadable APK
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/MPK-PMB-XXIX-v1.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPK-PMB-XXIX-Android-v1.4
          path: downloads/MPK-PMB-XXIX-v1.4.apk

      - name: Publish APK to GitHub Pages repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/MPK-PMB-XXIX-v1.4.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish Android APK v1.4"
            git push
          fi
